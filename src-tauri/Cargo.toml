[package]
name = "discord-lite"
version = "2.5.3"
description = "A lightweight desktop chat and voice application."
authors = ["Discord Lite contributors"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "discord_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
livekit = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows-capture = "2.0.1"
